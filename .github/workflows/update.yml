name: Auto Update M3U Playlist

on:
  schedule:
    - cron: '0 */3 * * *'  # Alle 3 Stunden
  workflow_dispatch:        # Manuelles Auslösen per Klick

concurrency:
  group: auto-update-m3u
  cancel-in-progress: false

permissions:
  contents: write           # Zwingend erforderlich für git push

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp

      - name: M3U Playlist generieren
        run: python generate_m3u.py

      - name: Änderungen speichern und hochladen
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update playlist.m3u"
          file_pattern: playlist.m3u
