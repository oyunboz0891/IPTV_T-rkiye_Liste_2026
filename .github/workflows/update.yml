name: Auto Update M3U Playlist

on:
  schedule:
    - cron: '0 */3 * * *'  # Alle 3 Stunden
  workflow_dispatch:        # Erlaubt manuelles Auslösen per Klick

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp

      - name: M3U Playlist generieren
        run: python generate_m3u.py

      - name: Änderungen speichern und hochladen
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add playlist.m3u
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "Auto-update playlist.m3u" && \
            git pull --rebase origin main && \
            git push
          )
