name: Auto Update M3U Playlist

on:
  schedule:
    - cron: '0 */3 * * *'  # Alle 3 Stunden
  workflow_dispatch:        # Manuelles Auslösen per Klick

concurrency:
  group: auto-update-playlist
  cancel-in-progress: true  # Stoppt laufende Vorgänger-Jobs bei neuem Start

permissions:
  contents: write           # Zwingend erforderlich für git push

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # Lädt die komplette Git-Historie für Rebase

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp

      - name: M3U Playlist generieren
        run: python generate_m3u.py

      - name: Änderungen speichern und hochladen
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git fetch origin main
          git add playlist.m3u
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git pull --rebase origin main
            git commit -m "Auto-update playlist.m3u"
            git push origin main
          fi
