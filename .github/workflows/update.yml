name: Auto Update M3U Playlist

on:
  schedule:
    - cron: '0 */3 * * *'  # Alle 3 Stunden
  workflow_dispatch:        # Manuelles Auslösen per Klick

permissions:
  contents: write           # Zwingend erforderlich für git push

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp

      - name: M3U Playlist generieren
        run: python generate_m3u.py

      - name: Änderungen speichern und hochladen
  run: |
    git config --local user.email "action@github.com"
    git config --local user.name "GitHub Action"
    git add playlist.m3u
    git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update playlist.m3u" && git pull --rebase && git push)
